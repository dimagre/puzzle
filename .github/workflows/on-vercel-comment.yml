name: Notify on Vercel preview

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write

jobs:
  notify:
    if: github.event.issue.pull_request != null && github.event.comment.user.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Extract preview URL and reply
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.comment.body || '';
            const match = body.match(/https:\/\/[a-z0-9-]+(?:-[a-z0-9-]+)*\.vercel\.app(?:\/[^\s)\]]*)?/i);
            if (!match) {
              core.info('No vercel.app URL found in comment; skipping.');
              return;
            }
            const url = match[0];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Vercel preview ready: ${url}`,
            });
